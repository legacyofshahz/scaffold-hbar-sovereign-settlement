name: External Scaffold Proof

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  scaffold-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.3

      - name: Configure Git identity for Scaffold-HBAR CLI
        run: |
          git config --global user.name "legacyofshahz"
          git config --global user.email "41898282+legacyofshahz@users.noreply.github.com"

      - name: Scaffold this public template through the official CLI
        run: |
          rm -rf /tmp/sovereign-settlement-proof
          npx --yes create-scaffold-hbar@latest \
            --destination /tmp/sovereign-settlement-proof \
            --template legacyofshahz/scaffold-hbar-sovereign-settlement \
            --frontend nextjs-app \
            --solidity-framework hardhat \
            --network testnet \
            --package-manager npm \
            --skip-hedera-skills \
            --ci

      - name: Verify generated project structure
        working-directory: /tmp/sovereign-settlement-proof
        run: |
          test -f package.json
          test -f README.md
          test -f AGENTS.md
          test -f packages/hardhat/package.json
          test -f packages/hardhat/contracts/OracleGuardedSettlement.sol
          test -f packages/hardhat/scripts/prove-testnet.ts
          test -f packages/nextjs/package.json
          test -f packages/nextjs/app/page.tsx
          test -f packages/nextjs/app/api/health/route.ts
          echo "GENERATED_STRUCTURE=PASS"

